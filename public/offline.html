<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#6366f1">
    <title>Connessione assente | Aurora</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f8f9fc; color: #111827; font: 16px/1.5 system-ui, sans-serif; }
      main { width: min(100%, 420px); padding: 32px; background: white; border: 1px solid #e5e7f0; border-radius: 24px; box-shadow: 0 12px 40px #17154a0a; }
      img { width: 64px; height: 64px; border-radius: 14px; }
      h1 { margin: 24px 0 8px; font-size: 24px; }
      p { color: #475569; }
      button { margin-top: 16px; padding: 12px 20px; border: 0; border-radius: 12px; background: #6366f1; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" onerror="this.style.display='none'">
      <h1>Aurora è offline</h1>
      <p>Riconnettiti per vedere i saldi e i movimenti aggiornati. I tuoi dati finanziari non sono conservati nella pagina offline.</p>
      <button type="button" onclick="location.reload()">Riprova</button>
    </main>
  </body>
</html>
